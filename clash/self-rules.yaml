# Config_Self — Clash Meta / Mihomo 分流片段
# 用法：把下面三段合并进你现有的 config.yaml
#   1) proxy-groups  — 策略组
#   2) rule-providers — 规则集（classical）
#   3) rules          — 匹配顺序（越具体越靠前）
#
# 不会覆盖你的 proxies / proxy-providers。
# RAW: https://raw.githubusercontent.com/chentanwan/Config_Self/main/rule/Clash/<Name>.yaml

proxy-groups:
  - name: PROXY
    type: select
    proxies: [DIRECT]   # 把你的机场/节点组名加在 DIRECT 前面

  - name: AI
    type: select
    proxies: [PROXY, DIRECT]
  - name: Crypto
    type: select
    proxies: [PROXY, DIRECT]
  - name: Web3
    type: select
    proxies: [PROXY, DIRECT]
  - name: Streaming
    type: select
    proxies: [PROXY, DIRECT]
  - name: Social
    type: select
    proxies: [PROXY, DIRECT]
  - name: Telegram
    type: select
    proxies: [PROXY, DIRECT]
  - name: Apple
    type: select
    proxies: [DIRECT, PROXY]
  - name: Microsoft
    type: select
    proxies: [DIRECT, PROXY]
  - name: China
    type: select
    proxies: [DIRECT, PROXY]
  - name: Final
    type: select
    proxies: [PROXY, DIRECT]

