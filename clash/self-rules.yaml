rules:
  # --- AI ---
  - RULE-SET,AI,AI
  # --- 交易所 / Web3（Web3 放交易所后面，避免钱包域名被 Crypto 抢走也可对调）---
  - RULE-SET,Crypto,Crypto
  - RULE-SET,Web3,Web3
  # --- 国外流媒体（单品牌优先于 GlobalMedia）---
  - RULE-SET,Netflix,Streaming
  - RULE-SET,Disney,Streaming
  - RULE-SET,HBO,Streaming
  - RULE-SET,Spotify,Streaming
  - RULE-SET,YouTube,Streaming
  - RULE-SET,Twitch,Streaming
  - RULE-SET,AmazonPrimeVideo,Streaming
  - RULE-SET,GlobalMedia,Streaming
  # --- 社交 ---
  - RULE-SET,Telegram,Telegram
  - RULE-SET,Whatsapp,Social
  - RULE-SET,Twitter,Social
  - RULE-SET,Facebook,Social
  - RULE-SET,Instagram,Social
  - RULE-SET,Threads,Social
  - RULE-SET,Discord,Social
  - RULE-SET,TikTok,Social
  # --- 苹果：先代理项，再国内直连项 ---
  - RULE-SET,AppleProxy,PROXY
  - RULE-SET,Apple,Apple
  # --- 微软 ---
  - RULE-SET,OneDrive,Microsoft
  - RULE-SET,Microsoft,Microsoft
  # --- 国内（放后面，避免误伤上面的国际服务）---
  - RULE-SET,ChinaMedia,China
  - RULE-SET,Tencent,China
  - RULE-SET,Alibaba,China
  - RULE-SET,Huawei,China
  - RULE-SET,ChinaMax,China
  - GEOIP,CN,China
  - MATCH,Final
