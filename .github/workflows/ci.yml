name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "rule/**"
      - "source/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python3 -m py_compile scripts/lib.py scripts/sync.py scripts/validate.py
      - name: Validate rules
        run: python3 scripts/validate.py
